name: SagaApp
options:
  bundleIdPrefix: dk.parthee.saga
  deploymentTarget:
    macOS: "15.0"  # CanaryKit kræver macOS 15+
  developmentLanguage: da
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  CanaryKit:
    path: ../../canary-coreml/swift
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: "-warnings-as-errors"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Saga:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/SagaApp
      - path: Sources/SagaCore
    dependencies:
      - package: CanaryKit
        product: CanaryKit
      - package: Sparkle
        product: Sparkle
    resources:
      - path: Resources
        excludes:
          - "Saga.entitlements"
      - path: ../../canary-coreml/models/mlpackage
        optional: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Saga
        CFBundleDisplayName: Saga
        CFBundleIdentifier: dk.parthee.saga
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Parthee Vijaya"
        NSMicrophoneUsageDescription: "Saga bruger mikrofonen til at lytte når du holder Fn-tasten nede, så din tale kan transkriberes til tekst."
        NSAppleEventsUsageDescription: "Saga indsætter transkriberet tekst ved markøren via system-events."
        NSScreenCaptureUsageDescription: "Saga bruger skærmoptagelse til vision-mode, hvor den kan beskrive eller besvare spørgsmål om indholdet på skærmen."
        NSSpeechRecognitionUsageDescription: "Saga bruger Apple's on-device speech recognition til at lytte efter wake-word ('Hej Saga'). Audio sendes ikke til Apple's cloud."
        # Sparkle auto-update — opdatér efter EdDSA-keypair er genereret + appcast er hostet.
        # Generér public key via: ./Tools/generate_keys (kommer med Sparkle-CLI)
        # Se docs/RELEASE.md for fuld setup-guide.
        SUFeedURL: "https://parthee-vijaya.github.io/saga-mac/appcast.xml"
        SUPublicEDKey: "REPLACE_WITH_BASE64_PUBLIC_KEY_FROM_generate_keys"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.parthee.saga
        PRODUCT_NAME: Saga
        CODE_SIGN_ENTITLEMENTS: Resources/Saga.entitlements
        CODE_SIGN_STYLE: Manual
        # Stabil signing med Apple Development identity — TCC-permissions
        # overlever rebuilds (csreq tied to cert, ikke binary-hash). SHA1 hash
        # peger direkte på "Apple Development: partivijaya@icloud.com" i Keychain.
        # Hvis cert udløber/fornyes: opdater hash via `security find-identity -v -p codesigning`.
        CODE_SIGN_IDENTITY: "9E6001BC0D64B78FD7E2A7B2BA6279A222A4EB5F"
        DEVELOPMENT_TEAM: "33XTP64658"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_APP_SANDBOX: NO  # Sandbox blokerer CGEventTap-features vi har brug for
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - SagaCoreTests
      gatherCoverageData: true

  SagaCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/SagaCoreTests
    dependencies:
      - target: Saga
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.parthee.saga.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Saga.app/Contents/MacOS/Saga
