[project]
name = "saga-sidecar"
version = "0.1.0"
description = "Hviske v5.3 ASR sidecar for Saga macOS app — FastAPI server with PyTorch+MPS inference"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary (uses Hviske CC BY-NC 4.0)" }
authors = [{ name = "Parthee Vijaya" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "transformers>=5.4.0,<5.7",  # 5.7 har kompatibilitetsbug med Hviske custom-code
    "huggingface-hub>=0.25.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "numpy>=1.26.0,<2.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
saga-sidecar = "saga_sidecar.server:main"
saga-download = "saga_sidecar.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saga_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
]
